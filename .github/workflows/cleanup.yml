name: Cleanup Todus

on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install aiohttp boto3 aioboto3
      - name: Purge orphan HLS
        run: python scripts/cleanup.py
